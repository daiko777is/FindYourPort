[package]
name = "fyp-ui"
version = "0.1.0"
edition = "2021"
description = "Slint UI for Find Your Port"
license = "MIT OR Apache-2.0"

[dependencies]
slint = "1.5"
fyp-core = { path = "../fyp-core" }
fyp-os = { path = "../fyp-os" }

[build-dependencies]
slint-build = "1.5"

[[bin]]
name = "fyp-ui"
path = "src/main.rs"

[lib]
name = "fyp_ui"
path = "src/lib.rs"
